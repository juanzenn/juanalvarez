# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    # React 18 is an intentional pin on Next 16 (see CONTEXT.md). Dependabot
    # grouped #75 as a 19.x major; ignore majors so 18.x patches still arrive.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      # Cypress 15 is an intentional pin (see CONTEXT.md). Ignore majors so
      # 15.x patches still arrive.
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
